apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-app-chart.fullname" . }}
  labels:
    {{- include "my-app-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "my-app-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "my-app-chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "my-app-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # 1. Pull in all variables from our ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "my-app-chart.fullname" . }}-config

          # 2. Write the environment variable to the web page before starting Nginx
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              echo "<html>
              <body style='font-family: sans-serif; padding: 2rem;'>
                <h1>$APP_GREETING</h1>
                <p><strong>Environment:</strong> $APP_ENVIRONMENT</p>
                <hr/>
                <p><strong>Served by Pod:</strong> <code style='background: #eee; padding: 2px 6px; font-size: 1.1em;'>$(hostname)</code></p>
              </body>
              </html>" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
